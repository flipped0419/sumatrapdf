name: Apply default borderless startup

on:
  push:
    branches:
      - modern-ui/v0.1-shell
    paths:
      - .github/workflows/apply-default-borderless.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restore original tab renderer
        shell: pwsh
        run: git checkout origin/master -- src/gui/win/TabsCtrl.cpp
      - name: Apply default borderless startup
        run: python modern_default_borderless_patch.py
      - name: Commit source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm modern_default_borderless_patch.py
          git add src/SumatraPDF.cpp src/gui/win/TabsCtrl.cpp
          git commit -m "ui: restore original tabs and default to borderless"
          git push origin HEAD:modern-ui/v0.1-shell
