name: Fix Modern UI v0.3 patch

on:
  push:
    branches:
      - modern-ui/v0.1-shell
    paths:
      - .github/workflows/fix-modern-ui-v03.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Fix tab-strip paint anchor
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/apply-modern-ui-v03.yml')
          s = p.read_text(encoding='utf-8')
          old = '''          replace_once(\n              "src/gui/win/TabsCtrl.cpp",\n              """            Color bgCol = GetColor(kColTabBg);\n              if (vroot) {\n                  PaintVirtTree(vroot, hdc, clientRc, bgCol);\n              } else {\n                  // no tabs: nothing but the background\n                  HdcFillRect(hdc, clientRc, bgCol);\n              }""",\n              """            Color bgCol = ModernTabStripBg(GetColor(kColTabBg));\n              if (vroot) {\n                  PaintVirtTree(vroot, hdc, clientRc, bgCol);\n              } else {\n                  // no tabs: nothing but the background\n                  HdcFillRect(hdc, clientRc, bgCol);\n              }""",\n          )'''
          new = '''          replace_once(\n              "src/gui/win/TabsCtrl.cpp",\n              "            Color bgCol = GetColor(kColTabBg);",\n              "            Color bgCol = ModernTabStripBg(GetColor(kColTabBg));",\n          )'''
          if old not in s:
              raise SystemExit('v0.3 workflow anchor block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-modern-ui-v03.yml
          git commit -m "ci: fix v0.3 tab-strip patch anchor"
          git push
