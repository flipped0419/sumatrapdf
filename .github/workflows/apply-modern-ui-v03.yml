name: Apply Modern UI v0.3

on:
  push:
    branches:
      - modern-ui/v0.1-shell
    paths:
      - .github/workflows/apply-modern-ui-v03.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Apply source patch
        run: python modern_ui_v03_patch.py
      - name: Regenerate commands
        run: bun .\cmd\gen-commands.ts
      - name: Commit source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm modern_ui_v03_patch.py
          git add cmd/gen-commands.ts src/Commands.cpp src/Commands.h src/Accelerators.cpp src/MainWindow.h src/SumatraPDF.h src/SumatraPDF.cpp src/Tabs.cpp src/Toolbar.cpp src/gui/win/TabsCtrl.cpp
          git commit -m "ui: edge tab strip and windowed borderless mode"
          git push origin HEAD:modern-ui/v0.1-shell
