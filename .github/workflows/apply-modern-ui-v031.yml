name: Apply Modern UI v0.3.1

on:
  push:
    branches:
      - modern-ui/v0.1-shell
    paths:
      - .github/workflows/apply-modern-ui-v031.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply source patch
        run: python modern_ui_v031_patch.py
      - name: Commit source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm modern_ui_v031_patch.py
          git add src/gui/win/TabsCtrl.cpp
          git commit -m "ui: make active tab merge into toolbar surface"
          git push origin HEAD:modern-ui/v0.1-shell
